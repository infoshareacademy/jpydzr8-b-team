{% extends "online_library/base.html" %}
{% block content %}
<main class="auth-wrapper">
    <div class="auth-container">
        <h2>Sign In</h2>
        <p class="text-muted">Enter your credentials to access your account.</p>

        {% if form.errors %}
            <p class="error-text">The username or password is incorrect. Please try again.</p>
        {% endif %}

        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit">Sign In</button>
        </form>
    </div>
</main>
{% endblock %}
